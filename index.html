<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a1d">
<title>ESREVER · the reverse singing party game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a1d;--ink:#f4f1ff;--mut:#9d96c9;--pink:#ff3d8b;--cyan:#2de2e6;--lime:#c6ff3d;--yel:#ffd23f;--card:#1a1540;--card2:#221b52;--line:#2f2870;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100dvh;color:var(--ink);font-family:Outfit,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(1100px 600px at 8% -10%,#4a1f8a55,transparent),radial-gradient(900px 500px at 100% 0%,#0aa5b240,transparent),var(--bg);background-attachment:fixed}
#app{max-width:680px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 60px}
h1,h2,h3{margin:0}
h2{font-size:24px;font-weight:800;letter-spacing:-.01em}
p{margin:6px 0;color:var(--mut);line-height:1.45}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.mini{font-family:Bungee,Impact,sans-serif;font-size:20px;background:linear-gradient(90deg,var(--pink),var(--yel));-webkit-background-clip:text;background-clip:text;color:transparent}
.room{margin-left:auto;font-size:13px;color:var(--mut);letter-spacing:.08em}
.room b{color:var(--cyan);font-size:16px;letter-spacing:.18em;margin-left:4px}
.x{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:6px 10px;font:600 13px Outfit,system-ui,sans-serif;cursor:pointer}
.hero{text-align:center;padding:18px 0 6px}
.logo{font-family:Bungee,Impact,sans-serif;font-size:clamp(46px,15vw,92px);line-height:.88;background:linear-gradient(90deg,var(--pink),var(--yel) 70%);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.01em}
.logo.refl{transform:scaleY(-.5);transform-origin:50% 0;opacity:.25;height:.5em;margin-top:.04em;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.tag{font-size:17px;color:var(--ink);margin:10px 0 18px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
label,.lbl{display:block;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px}
input,select{width:100%;background:#120e30;border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 14px;font:600 17px Outfit,system-ui,sans-serif;outline:none}
input:focus,select:focus{border-color:var(--cyan)}
#code{text-transform:uppercase;letter-spacing:.35em;text-align:center;font-family:Bungee,sans-serif}
.btn{border:0;border-radius:14px;padding:13px 18px;font:700 16px Outfit,system-ui,sans-serif;background:#2c2565;color:var(--ink);cursor:pointer;transition:transform .12s,filter .12s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:linear-gradient(135deg,var(--pink),#ff7a3d);box-shadow:0 8px 26px #ff3d8b44}
.btn.cy{background:linear-gradient(135deg,#17b6c9,#2de2e6);color:#06222a}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--mut)}
.btn.on{outline:2px solid var(--cyan);outline-offset:1px}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.row.wrap{flex-wrap:wrap}
.row.auto>*{flex:0 0 auto}
.stack>*+*{margin-top:10px}
.or{text-align:center;color:var(--mut);font-size:13px;margin:14px 0 10px}
.msg{color:var(--yel);font-weight:600;margin:10px 0 0;text-align:center}
.how{margin:18px 0 0;padding:0;list-style:none;counter-reset:s;text-align:left}
.how li{counter-increment:s;position:relative;padding:8px 0 8px 44px;color:var(--ink);line-height:1.35}
.how li:before{content:counter(s);position:absolute;left:0;top:5px;width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font:800 14px Outfit,system-ui,sans-serif;color:var(--cyan)}
.fine{font-size:13px;text-align:center;margin-top:16px}
.pill{display:inline-block;background:#2a2262;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--cyan);margin-bottom:10px}
.strip{display:flex;gap:8px;overflow:auto;padding:2px 0 8px;margin-bottom:6px}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 11px;font-size:13px;display:flex;gap:8px;align-items:center}
.chip i{font-style:normal;font-weight:800;color:var(--lime)}
.chip.singer{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.chip.singer b:before{content:"🎤 "}
.chip.off{opacity:.4}
.stage{text-align:center;padding:26px 0}
.eq{display:flex;gap:6px;justify-content:center;align-items:flex-end;height:64px;margin:0 auto 18px}
.eq i{width:9px;background:linear-gradient(var(--cyan),var(--pink));border-radius:5px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(1){animation-delay:-.9s}.eq i:nth-child(2){animation-delay:-.7s}.eq i:nth-child(3){animation-delay:-.5s}.eq i:nth-child(4){animation-delay:-.3s}.eq i:nth-child(5){animation-delay:-.6s}.eq i:nth-child(6){animation-delay:-.2s}.eq i:nth-child(7){animation-delay:-.8s}
@keyframes eq{0%,100%{height:10px}50%{height:62px}}
.idea{background:#120e30;border:1px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;margin:12px 0}
.idea span{flex:1;color:var(--ink)}
.idea button{background:none;border:0;font-size:22px;cursor:pointer}
.recwrap{text-align:center;padding:10px 0 4px}
.recbtn{position:relative;width:104px;height:104px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff7aa8,var(--pink) 60%,#c3125f);cursor:pointer;box-shadow:0 10px 34px #ff3d8b66;display:grid;place-items:center;margin:8px auto}
.recbtn .dot{width:34px;height:34px;border-radius:50%;background:#fff;transition:.2s}
.recbtn.on .dot{border-radius:8px;width:30px;height:30px}
.recbtn .ring{position:absolute;inset:-6px;border-radius:50%;border:3px solid #ff3d8b88;pointer-events:none;transition:transform .08s}
.recbtn.on{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 10px 50px #ff3d8bcc}}
.rtimer{font:800 22px Outfit,system-ui,sans-serif;font-variant-numeric:tabular-nums;margin-top:6px}
.hint{font-size:13px;color:var(--mut)}
canvas.wave{display:block;width:100%;height:74px;background:#100c2b;border-radius:12px;margin:8px 0}
.big{font-family:Bungee,sans-serif}
.code{font-family:Bungee,sans-serif;font-size:56px;letter-spacing:.16em;color:var(--cyan);text-align:center;margin:4px 0}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.plist li:last-child{border:0}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#0c0a1d}
.tagx{margin-left:auto;font-size:12px;color:var(--mut)}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--pink);margin:0 auto 18px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.res{position:relative}
.res .rank{position:absolute;right:14px;top:12px;font-size:30px}
.res h3{font-size:20px}
.score{font:800 46px Outfit,system-ui,sans-serif;line-height:1;background:linear-gradient(90deg,var(--lime),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.score small{font-size:18px;color:var(--mut);-webkit-text-fill-color:var(--mut)}
.verdict{font-weight:700;color:var(--yel);margin:2px 0 8px}
.bar{display:grid;grid-template-columns:78px 1fr 44px;gap:8px;align-items:center;font-size:14px;margin:5px 0}
.bar .track{height:9px;background:#120e30;border-radius:9px;overflow:hidden}
.bar .track span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--yel));border-radius:9px}
.bar.sub{opacity:.75;font-size:12.5px;grid-template-columns:78px 1fr 44px;padding-left:10px}
.bar b{text-align:right}
.podium{display:flex;gap:8px;align-items:flex-end;justify-content:center;margin:20px 0 10px;height:240px}
.pod{flex:1;max-width:150px;text-align:center}
.pod .blk{border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;font-family:Bungee,sans-serif}
.pod.p1 .blk{height:150px;background:linear-gradient(#ffd23f,#c98f00);color:#3b2a00}
.pod.p2 .blk{height:112px;background:linear-gradient(#d7def0,#8b94b3);color:#1d2238}
.pod.p3 .blk{height:84px;background:linear-gradient(#f0a070,#a35a2d);color:#3a1a08}
.pod .nm{font-weight:800;margin-bottom:6px;word-break:break-word}
.pod .em{font-size:34px}
table{width:100%;border-collapse:collapse}
td,th{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
th{font-size:11px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);background:#fff;color:#14102f;padding:11px 16px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
.sel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.code{font-size:44px}.bar{grid-template-columns:64px 1fr 40px}}
</style>

<body>
<main id="app"></main>
<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';document.head.appendChild(s)"></script>

<!-- =====================================================================
     SCORING ENGINE: compares the ORIGINAL clip with the player's attempt
     flipped back to normal. Pure functions, no DOM, no network.
     ===================================================================== -->
<script id="analyzer">
const Analyzer=(()=>{
const SR=16000,N=512,HOP=256,NM=24,NC=10,NF=N/2+1,D=NC-1;
/* Tunable calibration (all scores are 0..100) */
const TUNE={
  matchBest:0.30,   // DTW distance ratio vs shuffled baseline that earns 100% match
  matchWorst:1.10,  // ratio that earns 0% match
  pitchBestErr:0.5, // average semitone error that earns 100% pitch accuracy
  pitchWorstErr:2.8,// average semitone error that earns 0%
  wMatch:0.45, wAcc:0.55, // final = match*wMatch + accuracy*wAcc
  wPitch:0.65, wRhythm:0.35, // accuracy = pitch*wPitch + rhythm*wRhythm (pitch skipped for unvoiced clips)
  voicedNeeded:0.15 // fraction of voiced frames needed in the original to judge pitch
};
const cosT=new Float64Array(N/2),sinT=new Float64Array(N/2);
for(let i=0;i<N/2;i++){cosT[i]=Math.cos(2*Math.PI*i/N);sinT[i]=-Math.sin(2*Math.PI*i/N)}
const bitrev=new Uint16Array(N);{const b=Math.log2(N);for(let i=0;i<N;i++){let r=0;for(let k=0;k<b;k++)if(i&(1<<k))r|=1<<(b-1-k);bitrev[i]=r}}
const hann=new Float64Array(N);for(let i=0;i<N;i++)hann[i]=0.5-0.5*Math.cos(2*Math.PI*i/(N-1));
function fft(re,im){
  for(let i=0;i<N;i++){const j=bitrev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
  for(let size=2;size<=N;size<<=1){const half=size>>1,step=N/size;
    for(let i=0;i<N;i+=size)for(let j=0,k=0;j<half;j++,k+=step){
      const a=i+j,b=a+half,tr=re[b]*cosT[k]-im[b]*sinT[k],ti=re[b]*sinT[k]+im[b]*cosT[k];
      re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti}}
}
const mel=h=>2595*Math.log10(1+h/700),imel=m=>700*(Math.pow(10,m/2595)-1);
const FB=[];{const lo=mel(100),hi=mel(7000),pts=[];
  for(let i=0;i<NM+2;i++)pts.push(Math.round((N)*imel(lo+(hi-lo)*i/(NM+1))/SR));
  for(let m=1;m<=NM;m++){const f=new Float32Array(NF),a=pts[m-1],b=pts[m],c=pts[m+1];
    for(let k=a;k<b;k++)f[k]=(k-a)/Math.max(1,b-a);
    for(let k=b;k<=c&&k<NF;k++)f[k]=(c-k)/Math.max(1,c-b);
    if(b<NF&&f[b]===0)f[b]=1;FB.push(f)}}
const DCT=[];for(let c=1;c<NC;c++){const r=new Float64Array(NM);for(let m=0;m<NM;m++)r[m]=Math.cos(Math.PI*c*(m+0.5)/NM);DCT.push(r)}

const reverse=x=>{const n=x.length,y=new Float32Array(n);for(let i=0;i<n;i++)y[i]=x[n-1-i];return y};
const rms=x=>{let s=0;for(let i=0;i<x.length;i++)s+=x[i]*x[i];return Math.sqrt(s/Math.max(1,x.length))};
const peak=x=>{let p=0;for(let i=0;i<x.length;i++){const a=Math.abs(x[i]);if(a>p)p=a}return p};
const clamp01=v=>v<0?0:v>1?1:v;

/* cut dead air from both ends (keeps a little padding) */
function trimSilence(x,padMs=110){
  const w=160,n=Math.floor(x.length/w);if(n<3)return x;
  const e=new Float32Array(n);let mx=0;
  for(let i=0;i<n;i++){let s=0;for(let k=0;k<w;k++){const v=x[i*w+k];s+=v*v}e[i]=Math.sqrt(s/w);if(e[i]>mx)mx=e[i]}
  const thr=Math.max(0.006,mx*0.08);let a=0,b=n-1;
  while(a<n&&e[a]<thr)a++;while(b>a&&e[b]<thr)b--;
  if(a>=b)return x;
  const pad=Math.round(padMs*SR/1000);
  return x.slice(Math.max(0,a*w-pad),Math.min(x.length,(b+1)*w+pad));
}
function normalize(x,t=0.9){const p=peak(x);if(p<1e-4)return x;const g=t/p,y=new Float32Array(x.length);for(let i=0;i<x.length;i++)y[i]=x[i]*g;return y}

/* MFCC (c1..c12) with per-clip mean/variance normalisation */
function features(x){
  const n=Math.max(1,Math.floor((x.length-N)/HOP)+1),mels=new Float32Array(n*NM),re=new Float64Array(N),im=new Float64Array(N);let gmax=1e-12;
  for(let t=0;t<n;t++){const o=t*HOP;let prev=o>0?x[o-1]:0;
    for(let i=0;i<N;i++){const v=o+i<x.length?x[o+i]:0;re[i]=(v-0.97*prev)*hann[i];prev=v;im[i]=0}
    fft(re,im);
    for(let m=0;m<NM;m++){const f=FB[m];let s=0;for(let k=0;k<NF;k++){const w=f[k];if(w)s+=w*(re[k]*re[k]+im[k]*im[k])}mels[t*NM+m]=s;if(s>gmax)gmax=s}}
  const floor=gmax*1e-5,out=new Float32Array(n*D);
  for(let t=0;t<n;t++){const lm=new Float64Array(NM);for(let m=0;m<NM;m++)lm[m]=Math.log(Math.max(mels[t*NM+m],floor));
    for(let c=0;c<D;c++){let s=0;const r=DCT[c];for(let m=0;m<NM;m++)s+=lm[m]*r[m];out[t*D+c]=s}}
  for(let c=0;c<D;c++){let mu=0;for(let t=0;t<n;t++)mu+=out[t*D+c];mu/=n;let v=0;for(let t=0;t<n;t++){const d=out[t*D+c]-mu;v+=d*d}const sd=Math.sqrt(v/n)||1;for(let t=0;t<n;t++)out[t*D+c]=(out[t*D+c]-mu)/sd}
  return{n,m:out};
}

/* banded DTW, returns normalised distance and (optionally) the path */
function dtw(A,nA,B,nB,wantPath){
  const band=Math.floor(0.3*Math.max(nA,nB))+Math.abs(nA-nB)+8,INF=1e30,PEN=0.4;
  const cost=new Float32Array(nA*nB).fill(INF),len=new Uint16Array(nA*nB),dir=wantPath?new Uint8Array(nA*nB):null;
  for(let i=0;i<nA;i++){const jc=nA>1?i*(nB-1)/(nA-1):0,j0=Math.max(0,Math.ceil(jc-band)),j1=Math.min(nB-1,Math.floor(jc+band));
    for(let j=j0;j<=j1;j++){
      let s=0;for(let d=0;d<D;d++){const v=A[i*D+d]-B[j*D+d];s+=v*v}const c=Math.sqrt(s);
      let best=INF,bl=0,bd=0;
      if(i===0&&j===0){best=0}else{
        if(i>0&&j>0){const k=(i-1)*nB+j-1;if(cost[k]<best){best=cost[k];bl=len[k];bd=0}}
        if(i>0){const k=(i-1)*nB+j,v=cost[k]+PEN;if(v<best){best=v;bl=len[k];bd=1}}
        if(j>0){const k=i*nB+j-1,v=cost[k]+PEN;if(v<best){best=v;bl=len[k];bd=2}}}
      if(best>=INF)continue;
      const idx=i*nB+j;cost[idx]=best+c;len[idx]=bl+1;if(dir)dir[idx]=bd}}
  const end=nA*nB-1,d=cost[end]>=INF?Infinity:cost[end]/len[end];
  let path=null;
  if(wantPath&&isFinite(d)){const p=[];let i=nA-1,j=nB-1;
    for(;;){p.push(i,j);if(i===0&&j===0)break;const b=dir[i*nB+j];if(b===0){i--;j--}else if(b===1)i--;else j--;if(i<0||j<0)break}
    const n=p.length>>1;path=new Int32Array(p.length);for(let k=0;k<n;k++){path[2*k]=p[2*(n-1-k)];path[2*k+1]=p[2*(n-1-k)+1]}}
  return{d,path};
}
function shuffled(B,n,seed){ // block shuffle: keeps local texture, destroys the order
  const bs=8,nb=Math.ceil(n/bs),ord=[...Array(nb).keys()];let s=seed;
  for(let i=nb-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[ord[i],ord[j]]=[ord[j],ord[i]]}
  const out=new Float32Array(n*D);let w=0;
  for(const b of ord)for(let t=b*bs;t<Math.min(n,b*bs+bs);t++){for(let d=0;d<D;d++)out[w*D+d]=B[t*D+d];w++}
  return out;
}

/* f0 contour in semitones (NaN when unvoiced), aligned to feature frames */
function pitchTrack(x,n){
  const y=new Float32Array(x.length>>1);for(let i=0;i<y.length;i++)y[i]=(x[2*i]+x[2*i+1])*0.5; // 8 kHz
  const W=384,half=W>>1,LMIN=10,LMAX=115,out=new Float32Array(n).fill(NaN),fr=new Float32Array(n);let gmax=0;
  const cen=t=>((t*HOP+N/2)>>1);
  for(let t=0;t<n;t++){const c=cen(t);let s=0;for(let i=c-half;i<c+half;i++)if(i>=0&&i<y.length)s+=y[i]*y[i];fr[t]=Math.sqrt(s/W);if(fr[t]>gmax)gmax=fr[t]}
  const thr=Math.max(0.01,gmax*0.12),buf=new Float32Array(W),pre=new Float64Array(W+1),r=new Float32Array(LMAX+3);
  for(let t=0;t<n;t++){
    if(fr[t]<thr)continue;
    const c=cen(t);let mu=0;
    for(let i=0;i<W;i++){const k=c-half+i;buf[i]=k>=0&&k<y.length?y[k]:0;mu+=buf[i]}mu/=W;
    for(let i=0;i<W;i++){buf[i]-=mu;pre[i+1]=pre[i]+buf[i]*buf[i]}
    let mx=0;
    for(let l=LMIN-1;l<=LMAX+1;l++){let s=0;for(let i=0;i<W-l;i++)s+=buf[i]*buf[i+l];
      const ea=pre[W-l],eb=pre[W]-pre[l];r[l]=s/Math.sqrt(ea*eb+1e-9);if(l>=LMIN&&l<=LMAX&&r[l]>mx)mx=r[l]}
    if(mx<0.55)continue;
    let pick=-1;
    for(let l=LMIN;l<=LMAX;l++)if(r[l]>=r[l-1]&&r[l]>=r[l+1]&&r[l]>=0.88*mx){pick=l;break}
    if(pick<0)continue;
    const a=r[pick-1],b=r[pick],c2=r[pick+1],den=a-2*b+c2,delta=den<0?0.5*(a-c2)/den:0;
    out[t]=12*Math.log2((8000/(pick+delta))/110);
  }
  const sm=new Float32Array(out); // drop isolated frames, 3-point median
  for(let t=0;t<n;t++){const p=t>0?out[t-1]:NaN,q=t<n-1?out[t+1]:NaN;
    if(!isNaN(out[t])){if(isNaN(p)&&isNaN(q))sm[t]=NaN;else if(!isNaN(p)&&!isNaN(q))sm[t]=[p,out[t],q].sort((u,v)=>u-v)[1]}}
  return sm;
}
const wrap12=d=>{d=((d%12)+12)%12;return d>6?d-12:d};
function pitchError(pO,pG,path){ // best transposition (octave-agnostic) mean abs semitone error along DTW path
  const diffs=[];
  for(let k=0;k<path.length;k+=2){const a=pO[path[k]],b=pG[path[k+1]];if(!isNaN(a)&&!isNaN(b))diffs.push(a-b)}
  if(diffs.length<8)return{e:null,pairs:diffs.length};
  let best=1e9;for(let s=-6;s<6;s+=0.25){let t=0;for(const d of diffs)t+=Math.abs(wrap12(d-s));t/=diffs.length;if(t<best)best=t}
  return{e:best,pairs:diffs.length};
}

/* loudness envelope (dB) squeezed to 64 points, for timing/rhythm */
function envelope(x){
  const w=160,n=Math.max(1,Math.floor(x.length/w)),db=new Float32Array(n);let mx=-1e9;
  for(let i=0;i<n;i++){let s=0;for(let k=0;k<w;k++){const v=x[i*w+k]||0;s+=v*v}db[i]=20*Math.log10(Math.sqrt(s/w)+1e-5);if(db[i]>mx)mx=db[i]}
  const P=64,o=new Float32Array(P);
  for(let i=0;i<P;i++){const f=i*(n-1)/(P-1),a=Math.floor(f),b=Math.min(n-1,a+1),v=db[a]*(1-(f-a))+db[b]*(f-a);o[i]=clamp01((v-(mx-45))/45)}
  return o;
}
function pearson(a,b){let ma=0,mb=0;for(let i=0;i<a.length;i++){ma+=a[i];mb+=b[i]}ma/=a.length;mb/=b.length;
  let n=0,da=0,db=0;for(let i=0;i<a.length;i++){const x=a[i]-ma,y=b[i]-mb;n+=x*y;da+=x*x;db+=y*y}return da*db<1e-9?0:n/Math.sqrt(da*db)}

const ZERO=()=>({match:0,pitch:null,rhythm:0,accuracy:0,total:0,quiet:true});

/* original: Float32 clip. guess: the player's attempt AS RECORDED (backwards). */
function compare(original,guess){
  const O=normalize(trimSilence(original)),G=normalize(trimSilence(reverse(guess))); // flip the attempt back to normal
  if(G.length<SR*0.3||O.length<SR*0.3)return ZERO();
  const fO=features(O),fG=features(G);
  const aligned=dtw(fO.m,fO.n,fG.m,fG.n,true);
  if(!isFinite(aligned.d))return ZERO();
  let base=0;for(let k=0;k<2;k++){const b=dtw(fO.m,fO.n,shuffled(fG.m,fG.n,12345+k*77),fG.n,false).d;base+=isFinite(b)?b:aligned.d}
  base/=2;
  const ratio=base>1e-6?aligned.d/base:1;
  const match=clamp01((TUNE.matchWorst-ratio)/(TUNE.matchWorst-TUNE.matchBest));
  // timing
  const eo=envelope(O),eg=envelope(G),corr=pearson(eo,eg),q=Math.min(O.length,G.length)/Math.max(O.length,G.length);
  const rhythm=0.7*clamp01((corr-0.15)/0.7)+0.3*q*q;
  // pitch
  const pO=pitchTrack(O,fO.n),pG=pitchTrack(G,fG.n);
  let vo=0,vg=0;for(const v of pO)if(!isNaN(v))vo++;for(const v of pG)if(!isNaN(v))vg++;
  const applicable=vo/fO.n>=TUNE.voicedNeeded;
  let pitch=null,err=null;
  if(applicable){
    const pe=pitchError(pO,pG,aligned.path);err=pe.e;
    if(pe.e===null)pitch=0;else{
      const raw=clamp01((TUNE.pitchWorstErr-pe.e)/(TUNE.pitchWorstErr-TUNE.pitchBestErr)),cov=Math.min(1,pe.pairs/Math.max(1,vo));
      pitch=raw*(0.4+0.6*cov)}}
  const accuracy=pitch===null?rhythm:TUNE.wPitch*pitch+TUNE.wRhythm*rhythm;
  const total=TUNE.wMatch*match+TUNE.wAcc*accuracy;
  const P=v=>Math.round(v*100);
  return{match:P(match),pitch:pitch===null?null:P(pitch),rhythm:P(rhythm),accuracy:P(accuracy),total:P(total),quiet:false,dbg:{ratio,err,corr,q,vo:vo/fO.n,vg:vg/fG.n}};
}
return{compare,trimSilence,normalize,reverse,ZERO,SR,TUNE,peak,rms,_pitchTrack:pitchTrack};
})();
</script>

<!-- =====================================================================
     GAME: lobby, host-authoritative rounds, peer-to-peer over WebRTC

<script id="game">
const SR=Analyzer.SR;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3400)}
const PREFIX='esrever-v1-';
const ICE={iceServers:[
  {urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},
  {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}]};
const IDEAS=['Sing "Happy Birthday" in your best opera voice','Say: "She sells seashells by the seashore"','Hum a catchy tune with lots of ups and downs','Count from one to five like a movie trailer','Sing the alphabet song','Say your name like a dramatic announcer','Do a sheep, a cow and a duck','Sing "Twinkle, twinkle" with huge vibrato','Say: "Peter Piper picked a peck of pickled peppers"','Whistle a short melody, then say "ta-da!"','Say "Good morning, how are you today?" super cheerfully','Sing a made-up song about your breakfast'];
const COLORS=['#ff3d8b','#2de2e6','#c6ff3d','#ffd23f','#ff7a3d','#b78bff','#5be37d','#ff6b6b','#4ea8ff','#f78fb3'];

/* ---------- audio helpers ---------- */
const toI16=f=>{const o=new Int16Array(f.length);for(let i=0;i<f.length;i++){const v=Math.max(-1,Math.min(1,f[i]));o[i]=v<0?v*32768:v*32767}return o};
const fromI16=b=>{const a=b instanceof ArrayBuffer?new Int16Array(b):new Int16Array(b.buffer,b.byteOffset,b.byteLength>>1),o=new Float32Array(a.length);for(let i=0;i<a.length;i++)o[i]=a[i]/32768;return o};
const revCache=new WeakMap();
const rv=x=>{let r=revCache.get(x);if(!r){r=Analyzer.reverse(x);revCache.set(x,r)}return r};
const cat=(a,b,gap=0.4)=>{const g=Math.round(SR*gap),o=new Float32Array(a.length+g+b.length);o.set(a,0);o.set(b,a.length+g);return o};
function resample(x,from,to){if(from===to)return x;const r=from/to,n=Math.floor(x.length/r),o=new Float32Array(n);
  for(let i=0;i<n;i++){const a=i*r,b=(i+1)*r,i0=Math.floor(a),i1=Math.min(x.length,Math.max(i0+1,Math.ceil(b)));let s=0;for(let k=i0;k<i1;k++)s+=x[k];o[i]=s/(i1-i0)}return o}

let AC=null,curSrc=null;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function markPlaying(){$$('[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===L.playing))}
function stopPlay(){if(curSrc){try{curSrc.onended=null;curSrc.stop()}catch(e){}curSrc=null}L.playing=null;markPlaying()}
function play(key){
  if(L.playing===key){stopPlay();return}
  stopPlay();const x=getAudio(key);if(!x||!x.length)return;
  const c=ac(),b=c.createBuffer(1,x.length,SR);b.copyToChannel(x,0);
  const s=c.createBufferSource();s.buffer=b;s.connect(c.destination);
  s.onended=()=>{if(curSrc===s){curSrc=null;L.playing=null;markPlaying()}};
  curSrc=s;L.playing=key;markPlaying();s.start();
}
function drawWave(cv,x,col){
  const g=cv.getContext('2d'),w=cv.width,h=cv.height;g.clearRect(0,0,w,h);
  if(!x||!x.length){return}
  const grad=g.createLinearGradient(0,0,w,0);grad.addColorStop(0,'#ff3d8b');grad.addColorStop(1,'#2de2e6');g.fillStyle=col||grad;
  const bars=Math.floor(w/5),step=x.length/bars;
  for(let i=0;i<bars;i++){let m=0;for(let k=Math.floor(i*step);k<Math.floor((i+1)*step);k++){const a=Math.abs(x[k]);if(a>m)m=a}
    const bh=Math.max(2,m*h*0.92);g.fillRect(i*5+1,(h-bh)/2,3,bh)}
}

/* ---------- microphone recorder (raw PCM, no echo/noise processing) ---------- */
const WORKLET="class P extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor('rec-proc',P)";
async function recStart(max){
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
  const ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();
  const src=ctx.createMediaStreamSource(stream),sink=ctx.createGain();sink.gain.value=0;sink.connect(ctx.destination);
  const R={stream,ctx,src,chunks:[],n:0,sr:ctx.sampleRate,level:0,max,auto:null,stopped:false};
  const push=d=>{if(R.stopped)return;R.chunks.push(d);R.n+=d.length;let s=0,c=0;for(let i=0;i<d.length;i+=4){s+=d[i]*d[i];c++}R.level=Math.sqrt(s/Math.max(1,c));if(R.n>=R.sr*R.max&&R.auto)R.auto()};
  try{
    if(!ctx.audioWorklet)throw 0;
    const url=URL.createObjectURL(new Blob([WORKLET],{type:'application/javascript'}));
    await ctx.audioWorklet.addModule(url);
    const node=new AudioWorkletNode(ctx,'rec-proc');node.port.onmessage=e=>push(e.data);src.connect(node);node.connect(sink);R.node=node;
  }catch(e){
    const node=ctx.createScriptProcessor(4096,1,1);node.onaudioprocess=ev=>push(new Float32Array(ev.inputBuffer.getChannelData(0)));src.connect(node);node.connect(sink);R.node=node;
  }
  return R;
}
function recRelease(R){try{R.node&&R.node.disconnect();R.src.disconnect();R.stream.getTracks().forEach(t=>t.stop());R.ctx.close()}catch(e){}}
function recFinish(R){
  recRelease(R);
  const all=new Float32Array(R.n);let o=0;for(const c of R.chunks){all.set(c,o);o+=c.length}
  let x=resample(all,R.sr,SR);const rawPeak=Analyzer.peak(x);
  x=Analyzer.normalize(Analyzer.trimSilence(x));
  return{x,rawPeak};
}

/* ---------- state ---------- */
let S=null;            // public game state (same shape on host and clients)
let G=null;            // host-only authoritative state
let peer=null,hostConn=null,isHost=false,myId=null;const conns=new Map();
const L={name:store.get('esr_name')||'',code:(location.hash||'').replace('#','').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4),
  msg:'',busy:false,clip:null,rec:null,recording:false,R:null,submitted:false,results:null,playing:null,idea:Math.floor(Math.random()*IDEAS.length),phaseKey:''};
const pl=id=>S&&S.players.find(p=>p.id===id);
const me=()=>pl(myId);
const amSinger=()=>S&&S.singerId===myId;
const amGuesser=()=>S&&S.guessers.includes(myId);
const randCode=()=>{const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
const cleanName=()=>(L.name||'').replace(/[^\p{L}\p{N} _\-.!]/gu,'').trim().slice(0,14)||('Player'+Math.floor(10+Math.random()*90));
const recMax=()=>amSinger()&&!amGuesser()?S.cfg.maxClip:Math.min(12,Math.round(S.cfg.maxClip*1.4+1));

/* ---------- networking ---------- */
function peerOk(){if(typeof Peer==='undefined'){L.msg='Could not load the networking library (PeerJS). Check your connection and reload.';render();return false}return true}
function cleanup(){
  stopPlay();abortRec();
  for(const c of conns.values()){try{c.close()}catch(e){}}conns.clear();
  try{hostConn&&hostConn.close()}catch(e){}hostConn=null;
  try{peer&&peer.destroy()}catch(e){}peer=null;
  S=null;G=null;isHost=false;myId=null;L.clip=null;L.rec=null;L.results=null;L.submitted=false;L.phaseKey='';L.busy=false;
}
function fail(msg){cleanup();L.msg=msg;render()}
function leave(){cleanup();L.msg='';render()}
function toHost(m){if(isHost)hostHandle('host',m);else if(hostConn&&hostConn.open)hostConn.send(m)}
function bcast(m,except){for(const[id,c]of conns)if(id!==except&&c.open)c.send(m)}

function startHost(solo){
  if(!solo&&!peerOk())return;
  cleanup();isHost=true;myId='host';
  G={code:solo?'SOLO':'',phase:'lobby',round:0,rounds:0,singerId:null,order:[],roundGuessers:[],
     players:[{id:'host',name:cleanName(),score:0,connected:true,host:true}],cfg:{laps:solo?3:1,maxClip:8},clip:null,guesses:{},solo};
  if(solo){publishState();hostStart();return}
  L.busy=true;L.msg='Creating your room...';render();openHostPeer(0);
}
function openHostPeer(n){
  G.code=randCode();peer=new Peer(PREFIX+G.code,{config:ICE,debug:0});
  peer.on('open',()=>{L.busy=false;L.msg='';publishState()});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'&&n<6){try{peer.destroy()}catch(_){}openHostPeer(n+1)}
    else if(L.busy)fail('Could not create a room ('+e.type+'). Try again.');
    else toast('Network hiccup: '+e.type)});
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('connection',conn=>{
    conn.on('data',m=>hostHandle(conn.peer,m,conn));
    conn.on('close',()=>hostGone(conn.peer));conn.on('error',()=>hostGone(conn.peer));
  });
}
function joinRoom(){
  if(!peerOk())return;
  const code=L.code.trim().toUpperCase();
  if(code.length!==4){L.msg='Enter the 4 letter room code.';render();return}
  const nm=cleanName();cleanup();L.name=nm;L.busy=true;L.msg='Connecting to room '+code+'...';render();
  let opened=false;const to=setTimeout(()=>{if(!opened)fail('Could not reach room '+code+'. Check the code, and that the host still has the page open.')},16000);
  peer=new Peer(undefined,{config:ICE,debug:0});
  peer.on('open',()=>{
    hostConn=peer.connect(PREFIX+code,{reliable:true});
    hostConn.on('open',()=>{opened=true;clearTimeout(to);hostConn.send({t:'join',name:nm})});
    hostConn.on('data',onMsg);
    hostConn.on('close',()=>{if(S){toast('The host left, game over.');leave()}});
    hostConn.on('error',()=>{});
  });
  peer.on('error',e=>{clearTimeout(to);if(S){toast('Network hiccup: '+e.type);return}
    fail(e.type==='peer-unavailable'?'Room '+code+' was not found.':'Connection problem ('+e.type+'). Try again.')});
}

/* ---------- host logic (authoritative) ---------- */
const gp=id=>G.players.find(p=>p.id===id);
function publicState(){
  return{code:G.code,phase:G.phase,round:G.round,rounds:G.rounds,singerId:G.singerId,solo:G.solo,cfg:G.cfg,
    guessers:G.roundGuessers,done:Object.keys(G.guesses),
    players:G.players.map(p=>({id:p.id,name:p.name,score:p.score,connected:p.connected,host:!!p.host}))};
}
function publishState(){const s=publicState();bcast({t:'state',s});onMsg({t:'state',s})}
function uniqueName(n){let name=n,k=2;while(G.players.some(p=>p.name===name))name=n.slice(0,12)+k++;return name}
function singerFor(round){const o=G.order;for(let k=0;k<o.length;k++){const id=o[(round-1+k)%o.length];if(gp(id)&&gp(id).connected)return id}return o[0]}
function guessersOf(){const sg=G.singerId,g=G.players.filter(p=>p.connected&&p.id!==sg).map(p=>p.id);return g.length?g:(gp(sg)&&gp(sg).connected?[sg]:[])}

function hostHandle(from,m,conn){
  if(!G)return;
  switch(m.t){
    case 'join':{
      if(gp(from)){conns.set(from,conn);conn.send({t:'hello',id:from});return}
      if(G.phase!=='lobby'||G.players.filter(p=>p.connected).length>=10){
        conn.send({t:'kick',why:G.phase!=='lobby'?'That game has already started.':'That room is full.'});setTimeout(()=>{try{conn.close()}catch(e){}},400);return}
      G.players.push({id:from,name:uniqueName(String(m.name||'Player').slice(0,14)),score:0,connected:true});
      conns.set(from,conn);conn.send({t:'hello',id:from});publishState();break}
    case 'clip':{
      if(G.phase!=='sing'||from!==G.singerId||!m.pcm)return;
      G.clip=fromI16(m.pcm);G.guesses={};G.roundGuessers=guessersOf();
      for(const id of G.roundGuessers)if(id!==G.singerId)sendTo(id,{t:'clip',pcm:toI16(G.clip).buffer});
      G.phase='mimic';publishState();break}
    case 'guess':{
      if(G.phase!=='mimic'||!G.roundGuessers.includes(from)||G.guesses[from]||!m.pcm)return;
      G.guesses[from]=fromI16(m.pcm);publishState();checkAllDone();break}
    case 'start':if(from==='host')hostStart();break;
    case 'skip':if(from==='host')hostSkip();break;
    case 'next':if(from==='host')hostNext();break;
    case 'again':if(from==='host')hostAgain();break;
  }
}
function sendTo(id,m){if(id==='host')onMsg(m);else{const c=conns.get(id);if(c&&c.open)c.send(m)}}
function hostGone(id){
  if(!G)return;const p=gp(id);if(!p)return;conns.delete(id);
  if(G.phase==='lobby'){G.players=G.players.filter(x=>x.id!==id);publishState();return}
  p.connected=false;toast(p.name+' left');
  if(G.phase==='sing'&&G.singerId===id){hostNext(true);return}
  if(G.phase==='mimic'){G.roundGuessers=G.roundGuessers.filter(x=>x!==id||G.guesses[id]);if(!G.roundGuessers.length){hostNext(true);return}checkAllDone()}
  publishState();
}
function checkAllDone(){if(G.phase==='mimic'&&G.roundGuessers.every(id=>G.guesses[id]||!gp(id).connected))finishRound()}
function hostStart(){
  if(G.phase!=='lobby')return;
  G.order=G.players.filter(p=>p.connected).map(p=>p.id);G.players.forEach(p=>p.score=0);
  G.rounds=G.order.length*G.cfg.laps;G.round=1;G.singerId=singerFor(1);G.phase='sing';G.clip=null;G.guesses={};G.roundGuessers=[];
  publishState();
}
function hostSkip(){if(G.phase==='sing')hostNext(true);else if(G.phase==='mimic')finishRound()}
function hostNext(){
  if(G.round>=G.rounds){G.phase='final';publishState();return}
  G.round++;G.singerId=singerFor(G.round);G.phase='sing';G.clip=null;G.guesses={};G.roundGuessers=[];publishState();
}
function hostAgain(){G.phase='lobby';G.round=0;G.rounds=0;G.singerId=null;G.players=G.players.filter(p=>p.connected);G.players.forEach(p=>p.score=0);G.clip=null;G.guesses={};G.roundGuessers=[];publishState()}
function finishRound(){
  if(G.phase!=='mimic')return;G.phase='judging';publishState();
  setTimeout(()=>{
    const items=[];
    for(const id of G.roundGuessers){
      const p=gp(id),g=G.guesses[id];let r;
      if(g){try{r=Analyzer.compare(G.clip,g)}catch(e){console.error(e);r=Analyzer.ZERO()}}else r=Analyzer.ZERO();
      const{dbg,...rest}=r;
      items.push({id,name:p.name,missing:!g,...rest,pcm:g?toI16(g).buffer:null});
    }
    items.sort((a,b)=>b.total-a.total);
    let bonus=0;
    if(!G.roundGuessers.includes(G.singerId)&&items.length){bonus=Math.round(0.4*items.reduce((s,i)=>s+i.total,0)/items.length);gp(G.singerId).score+=bonus}
    for(const it of items)gp(it.id).score+=it.total;
    G.phase='reveal';
    const res={t:'results',round:G.round,singerId:G.singerId,bonus,items};
    bcast(res);onMsg(res);publishState();
  },60);
}

/* ---------- client message handler (host uses it too) ---------- */
function onMsg(m){
  switch(m.t){
    case 'hello':myId=m.id;break;
    case 'kick':{const why=m.why;fail(why);break}
    case 'clip':L.clip=fromI16(m.pcm);render();break;
    case 'results':
      L.results={round:m.round,singerId:m.singerId,bonus:m.bonus,items:m.items.map(it=>({...it,f32:it.pcm?fromI16(it.pcm):null}))};break;
    case 'state':{
      S=m.s;
      const key=S.phase+':'+S.round;
      if(key!==L.phaseKey){
        L.phaseKey=key;stopPlay();abortRec();L.submitted=false;L.rec=null;
        if(S.phase==='sing'){L.clip=null;L.results=null}
        if(S.phase==='lobby'){L.clip=null;L.results=null}
        if(S.phase==='sing'&&S.singerId===myId)L.idea=(L.idea+1)%IDEAS.length;
      }
      render();break}
  }
}

/* ---------- recording actions ---------- */
function abortRec(){if(L.R){L.R.stopped=true;recRelease(L.R);L.R=null}L.recording=false}
async function toggleRec(){
  if(L.recording){stopRec();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('No microphone access here. Open the page over https.');return}
  stopPlay();
  try{L.R=await recStart(recMax())}catch(e){toast('Microphone blocked. Allow it in the browser and try again.');return}
  L.rec=null;L.recording=true;L.R.auto=()=>stopRec();render();meterLoop();
}
function stopRec(){
  const R=L.R;if(!R||R.stopped)return;R.stopped=true;L.recording=false;L.R=null;
  const{x,rawPeak}=recFinish(R);
  if(x.length<SR*0.5||rawPeak<0.02){toast("Didn't hear much. Get closer to the mic and try again.");L.rec=null}else L.rec=x;
  render();
}
function meterLoop(){
  const R=L.R;if(!L.recording||!R||R.stopped)return;
  const t=$('#rtimer');if(t)t.textContent=(R.n/R.sr).toFixed(1)+'s / '+R.max+'s';
  const r=$('#ring');if(r)r.style.transform='scale('+(1+Math.min(1,R.level*7)*0.7).toFixed(3)+')';
  requestAnimationFrame(meterLoop);
}

/* ---------- audio lookup for play buttons & waveforms ---------- */
function getAudio(k){
  switch(k){case 'draft':return L.rec;case 'draftRev':return L.rec&&rv(L.rec);case 'orig':return L.clip;case 'target':return L.clip&&rv(L.clip)}
  const m=/^(g|f|c)(\d+)$/.exec(k||'');
  if(m&&L.results){const it=L.results.items[+m[2]];if(!it||!it.f32)return null;
    if(m[1]==='g')return it.f32;if(m[1]==='f')return rv(it.f32);return L.clip?cat(L.clip,rv(it.f32)):null}
  return null;
}

/* ---------- views ---------- */
const playBtn=(k,label,cls='')=>`<button class="btn ${cls}" data-act="play" data-k="${k}">${label}</button>`;
const wave=k=>`<canvas class="wave" data-w="${k}"></canvas>`;
const medal=i=>['🥇','🥈','🥉'][i]||('#'+(i+1));
const verdict=t=>t>=85?'Spot on! 🔥':t>=65?'Nice flip! ✨':t>=45?'Getting there 👀':t>=25?'Wobbly... 🌀':'Lost in translation 🙃';
const bar=(l,v,sub)=>`<div class="bar ${sub?'sub':''}"><span>${l}</span><div class="track"><span style="width:${v}%"></span></div><b>${v}%</b></div>`;
const avatar=(p,i)=>`<div class="av" style="background:${COLORS[i%COLORS.length]}">${esc(p.name.slice(0,1).toUpperCase())}</div>`;

function header(){return `<div class="top"><div class="mini">ESREVER</div>${S&&!S.solo?`<div class="room">ROOM<b>${S.code}</b></div>`:'<div class="room"></div>'}${S?'<button class="x" data-act="leave">Leave</button>':''}</div>`}
function strip(){if(!S||S.phase==='lobby'||S.phase==='final')return'';
  return `<div class="strip">${[...S.players].sort((a,b)=>b.score-a.score).map(p=>`<div class="chip ${p.id===S.singerId?'singer':''} ${p.connected?'':'off'}"><b>${esc(p.name)}</b><i>${p.score}</i></div>`).join('')}</div>`}
const roundPill=()=>`<div class="pill">Round ${S.round} of ${S.rounds}</div>`;

function vHome(){
  return `<section class="hero"><div class="logo">REVERSE</div><div class="logo refl" aria-hidden="true">REVERSE</div>
  <p class="tag">Sing it. Flip it. Copy the backwards. Flip it back.</p></section>
  <div class="card stack">
    <div><label for="name">Your name</label><input id="name" maxlength="14" placeholder="e.g. Mjv" value="${esc(L.name)}" autocomplete="off"></div>
    <button class="btn pri block" data-act="create" ${L.busy?'disabled':''}>Create a room</button>
    <div class="or">or join a friend</div>
    <div class="row"><input id="code" maxlength="4" placeholder="CODE" value="${esc(L.code)}" autocomplete="off" autocapitalize="characters"><button class="btn cy" data-act="join" ${L.busy?'disabled':''}>Join</button></div>
    ${L.msg?`<div class="msg">${esc(L.msg)}</div>`:''}
    <button class="btn ghost block" data-act="solo">Practice solo</button>
  </div>
  <ol class="how">
    <li>One player records a short line or a bit of singing.</li>
    <li>Everyone else hears it <b>played backwards</b>.</li>
    <li>Imitate that backwards sound as exactly as you can.</li>
    <li>We flip your attempt forwards and score how close it is to the original: match, pitch and timing.</li>
  </ol>
  <p class="fine">Use headphones so the mic does not hear the playback. Mic needs https (GitHub Pages is fine).</p>`;
}
function vLobby(){
  const host=isHost,ps=S.players.filter(p=>p.connected);
  return `<div class="card"><label>Room code</label><div class="code">${S.code}</div>
    <div class="row"><button class="btn cy" data-act="copy">Copy invite link</button></div>
    <p class="fine" style="margin-bottom:0">Friends open the link (or type the code) on the same page.</p></div>
  <div class="card"><label>Players (${ps.length}/10)</label><ul class="plist">${S.players.map((p,i)=>`<li>${avatar(p,i)}<b>${esc(p.name)}</b>${p.host?'<span class="tagx">host</span>':''}</li>`).join('')}</ul></div>
  ${host?`<div class="card"><div class="sel"><div><label>Laps</label><select data-cfg="laps">${[1,2,3].map(n=>`<option value="${n}" ${S.cfg.laps===n?'selected':''}>${n} (${n*ps.length} rounds)</option>`).join('')}</select></div>
    <div><label>Max clip</label><select data-cfg="maxClip">${[5,8,12].map(n=>`<option value="${n}" ${S.cfg.maxClip===n?'selected':''}>${n} seconds</option>`).join('')}</select></div></div></div>
    <button class="btn pri block" data-act="start">${ps.length<2?'Start (solo for now)':'Start game'}</button>
    <p class="fine">Everyone takes turns being the singer. Keep this tab open: you are the host.</p>`
  :`<div class="stage"><div class="eq"><i></i><i></i><i></i><i></i><i></i></div><p>Waiting for the host to start...</p></div>`}`;
}
function recZone(){
  const max=recMax();
  return `<div class="recwrap"><button class="recbtn ${L.recording?'on':''}" data-act="rec" aria-label="record"><span class="ring" id="ring"></span><span class="dot"></span></button>
    <div class="rtimer" id="rtimer">${L.recording?'0.0s / '+max+'s':'Up to '+max+'s'}</div>
    <div class="hint">${L.recording?'Tap to stop':'Tap to record'}</div></div>`;
}
function vSing(){
  const sg=pl(S.singerId);
  if(!amSinger())return `${roundPill()}<div class="stage"><div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><h2>${esc(sg.name)} is recording a clip</h2><p>Soon you will hear it backwards. Get your best reverse voice ready.</p>${isHost?'<button class="btn ghost" data-act="skip" style="margin-top:14px">Skip this singer</button>':''}</div>`;
  let body;
  if(L.submitted)body=`<div class="stage"><div class="eq"><i></i><i></i><i></i><i></i><i></i></div><h2>Sent!</h2><p>Waiting for everyone to copy it backwards...</p>${wave('draft')}<div class="row">${playBtn('draft','▶ Original')}${playBtn('draftRev','⏪ Backwards')}</div></div>`;
  else if(L.rec)body=`${wave('draft')}<div class="row wrap">${playBtn('draft','▶ Hear it')}${playBtn('draftRev','⏪ Hear it backwards')}</div>
      <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="retake">↺ Retake</button><button class="btn pri" data-act="send">Send it ➜</button></div>`;
  else body=`<div class="idea"><span>💡 ${esc(IDEAS[L.idea%IDEAS.length])}</span><button data-act="idea" aria-label="new idea">🎲</button></div>${recZone()}`;
  return `${roundPill()}<h2>You are the singer 🎤</h2><p>Sing or say something. Clear, fun, and not too fast so friends can copy the backwards version.</p><div class="card">${body}</div>`;
}
function vMimic(){
  const sg=pl(S.singerId);
  if(!amGuesser()){
    return `${roundPill()}<div class="stage"><div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><h2>Your clip is out there</h2><p>Waiting for everyone to copy it backwards.</p></div>
    <div class="card"><label>Attempts</label><ul class="plist">${S.guessers.map((id,i)=>`<li>${avatar(pl(id),i)}<b>${esc(pl(id).name)}</b><span class="tagx">${S.done.includes(id)?'✅ done':'recording...'}</span></li>`).join('')}</ul></div>
    ${isHost?'<button class="btn ghost block" data-act="skip">Skip waiting</button>':''}`;
  }
  let body;
  if(L.submitted)body=`<div class="stage"><div class="spin"></div><h2>Locked in!</h2><p>Waiting for the others... (${S.done.length}/${S.guessers.length})</p>${wave('draft')}</div>`;
  else if(L.rec)body=`<div class="lbl">Your attempt</div>${wave('draft')}<div class="row wrap">${playBtn('draft','▶ My attempt')}</div>
    <p class="hint" style="margin-top:8px">No peeking: the flipped-back version is revealed after everyone submits.</p>
    <div class="row" style="margin-top:8px"><button class="btn ghost" data-act="retake">↺ Retake</button><button class="btn pri" data-act="submit">Submit ➜</button></div>`;
  else body=recZone();
  const singerLine=S.solo?'You sang it. Pretend you forgot!':`${esc(sg.name)} sang this.`;
  return `${roundPill()}<h2>Copy the backwards sound!</h2><p>${singerLine} Listen as often as you like, then imitate every wobble, breath and note.</p>
    <div class="card"><div class="lbl">Target (played backwards)</div>${L.clip?wave('target')+`<div class="row">${playBtn('target','▶ Hear the target','cy')}</div>`:'<p>Receiving the clip...</p>'}</div>
    ${L.clip?`<div class="card">${body}</div>`:''}
    ${isHost&&!L.submitted?'<button class="btn ghost block" data-act="skip">Skip waiting</button>':''}`;
}
function vJudging(){return `<div class="stage"><div class="spin"></div><h2>Flipping and judging...</h2><p>Comparing every attempt with the original.</p></div>`}
function vReveal(){
  const R=L.results;if(!R)return vJudging();
  const sg=pl(R.singerId),last=S.round>=S.rounds;
  return `${roundPill()}<h2>Round results</h2>
  <div class="card"><div class="lbl">The original${sg?' by '+esc(sg.name):''}</div>${L.clip?wave('orig')+`<div class="row wrap">${playBtn('orig','▶ Original')}${playBtn('target','⏪ Backwards')}</div>`:''}
    ${R.bonus?`<p style="margin-top:10px">🎤 ${esc(sg?sg.name:'Singer')} earns a <b style="color:var(--lime)">+${R.bonus}</b> clarity bonus.</p>`:''}</div>
  ${R.items.map((it,i)=>`<div class="card res"><div class="rank">${medal(i)}</div><h3>${esc(it.name)}</h3>
     <div class="score">${it.total}<small> pts</small></div><div class="verdict">${it.missing?'No attempt in time':it.quiet?'Could not hear a voice':verdict(it.total)}</div>
     ${it.missing?'':`${bar('Match',it.match)}${bar('Accuracy',it.accuracy)}${it.pitch!==null?bar('Pitch',it.pitch,1):''}${bar('Timing',it.rhythm,1)}
     ${wave('f'+i)}<div class="row wrap"><button class="btn" data-act="play" data-k="g${i}">▶ Their attempt</button><button class="btn cy" data-act="play" data-k="f${i}">⏪ Flipped back</button><button class="btn" data-act="play" data-k="c${i}">⇄ Original, then flipped</button></div>`}</div>`).join('')}
  <div class="card"><label>Standings</label>${standings()}</div>
  ${isHost?`<button class="btn pri block" data-act="next">${last?'See final ranking 🏆':'Next round ➜'}</button>`:'<p class="fine">Waiting for the host to continue...</p>'}`;
}
function standings(){
  const ps=[...S.players].sort((a,b)=>b.score-a.score);
  return `<table><tr><th>#</th><th>Player</th><th class="n">Total</th></tr>${ps.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}${p.connected?'':' (left)'}</td><td class="n"><b>${p.score}</b></td></tr>`).join('')}</table>`;
}
function vFinal(){
  const ps=[...S.players].sort((a,b)=>b.score-a.score),top=ps.slice(0,3);
  const order=[top[1],top[0],top[2]].map((p,i)=>p?{p,c:['p2','p1','p3'][i],e:['🥈','🏆','🥉'][i]}:null).filter(Boolean);
  return `<div class="stage" style="padding-bottom:0"><h2>Final ranking</h2><p>${esc(ps[0].name)} is the reverse champion!</p></div>
  <div class="podium">${order.map(o=>`<div class="pod ${o.c}"><div class="em">${o.e}</div><div class="nm">${esc(o.p.name)}</div><div class="blk">${o.p.score}</div></div>`).join('')}</div>
  <div class="card"><label>Full standings</label>${standings()}</div>
  ${isHost?'<button class="btn pri block" data-act="again">Play again</button>':'<p class="fine">Waiting for the host to start another game...</p>'}`;
}
function render(){
  const app=$('#app');
  let h=header();
  if(!S)h=vHome();
  else h+=strip()+({lobby:vLobby,sing:vSing,mimic:vMimic,judging:vJudging,reveal:vReveal,final:vFinal}[S.phase]||vHome)();
  app.innerHTML=h;
  $$('canvas.wave').forEach(c=>{const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.max(10,Math.round(r.width*d));c.height=Math.max(10,Math.round(r.height*d));drawWave(c,getAudio(c.dataset.w))});
  markPlaying();
  if(L.recording)meterLoop();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  switch(b.dataset.act){
    case 'create':L.name=($('#name')||{}).value||L.name;store.set('esr_name',L.name);startHost(false);break;
    case 'solo':L.name=($('#name')||{}).value||L.name;store.set('esr_name',L.name);startHost(true);break;
    case 'join':L.name=($('#name')||{}).value||L.name;store.set('esr_name',L.name);joinRoom();break;
    case 'leave':leave();break;
    case 'copy':{const url=location.href.split('#')[0]+'#'+S.code;
      (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast('Invite link copied'),()=>toast(url));break}
    case 'start':toHost({t:'start'});break;
    case 'rec':toggleRec();break;
    case 'retake':stopPlay();L.rec=null;render();break;
    case 'send':if(L.rec){L.clip=L.rec;L.submitted=true;toHost({t:'clip',pcm:toI16(L.rec).buffer});render()}break;
    case 'submit':if(L.rec){L.submitted=true;toHost({t:'guess',pcm:toI16(L.rec).buffer});render()}break;
    case 'play':ac();play(b.dataset.k);break;
    case 'idea':L.idea=(L.idea+1)%IDEAS.length;render();break;
    case 'skip':toHost({t:'skip'});break;
    case 'next':toHost({t:'next'});break;
    case 'again':toHost({t:'again'});break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='name'){L.name=e.target.value;store.set('esr_name',L.name)}
  if(e.target.id==='code'){const v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');e.target.value=v;L.code=v}
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.cfg;
  if(k&&G&&isHost){G.cfg[k]=+e.target.value;publishState()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='code')joinRoom()});
window.addEventListener('beforeunload',()=>{try{peer&&peer.destroy()}catch(e){}});
render();
</script>
</body>
</html>
